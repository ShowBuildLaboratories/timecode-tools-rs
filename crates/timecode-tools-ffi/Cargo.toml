[package]
name = "timecode-tools-ffi"
description = "C interface to timecode-tools (used by the Dart package and other bindings)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Distributed as prebuilt libraries (GitHub Releases), not on crates.io.
publish = false

[lib]
name = "timecode_tools_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
timecode-tools = { path = "../timecode-tools", version = "=0.1.0" }
