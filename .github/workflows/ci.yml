name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: C interface (header, layout, smoke test)
        if: matrix.os != 'windows-latest'
        run: scripts/check-c-abi.sh
      - run: cargo publish -p timecode-tools --dry-run
        if: matrix.os == 'ubuntu-latest'

  msrv:
    name: Rust 1.88 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test -p timecode-tools

  reference:
    name: Dart reference and goldens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      # Includes the check that goldens/receiver matches the reference.
      - run: dart test
